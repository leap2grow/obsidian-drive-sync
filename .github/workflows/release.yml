name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            # Node 24 ships npm 11; npm 10's `npm ci` rejects the lock file (vite's optional esbuild peer).
            - name: Use Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24.x"

            - name: Check tag matches manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$tag" != "$version" ]; then
                    echo "Tag $tag does not match manifest.json version $version"
                    exit 1
                  fi

            - name: Build plugin
              run: |
                  npm ci --ignore-scripts
                  npm test
                  npm run build

            # Published (not draft) so BRAT can install it straight away.
            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    main.js manifest.json styles.css
